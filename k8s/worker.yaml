apiVersion: apps/v1
kind: Deployment
metadata:
  name: tritondft-worker
  namespace: datahub-llm
  labels:
    k8s-app: tritondft-worker
spec:
  # Concurrency = replica count. Each worker pod is its own process (own
  # sys.stdout) and runs exactly one DFT job at a time. Scale this number.
  replicas: 8
  selector:
    matchLabels:
      k8s-app: tritondft-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        k8s-app: tritondft-worker
    spec:
      priorityClassName: opportunistic
      # Give in-flight jobs a chance to checkpoint output before SIGKILL.
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values: ["true"]
      containers:
      - name: worker
        image: docker.io/yil384/tritondft:v48
        imagePullPolicy: Always
        # tini reaps orphaned mpirun/pw.x children.
        command: ["/usr/bin/tini", "--", "python", "/workspace/src/worker.py"]
        env:
        - name: OPENAI_API_KEY
          valueFrom: { secretKeyRef: { name: tritondft-secrets, key: OPENAI_API_KEY } }
        - name: MP_API_KEY
          valueFrom: { secretKeyRef: { name: tritondft-secrets, key: MP_API_KEY } }
        - name: DATABASE_URL
          valueFrom: { secretKeyRef: { name: tritondft-secrets, key: DATABASE_URL } }
        # Auth for the Claude Code CLI generator (claude-* models). Optional —
        # OpenAI models work without it.
        - name: CLAUDE_CODE_OAUTH_TOKEN
          valueFrom:
            secretKeyRef: { name: tritondft-secrets, key: CLAUDE_CODE_OAUTH_TOKEN, optional: true }
        - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
          value: "1"
        # Hard wall-clock cap for a single user job. Only 8 worker slots exist,
        # so this bounds how long one job can starve the queue. Raised from 300s
        # because a correct band-structure workflow chains 4 pw.x runs
        # (vc-relax -> scf -> bands -> bands.x) and could not finish in 5 min.
        - name: JOB_TIMEOUT_S
          value: "1200"
        # Per-pw.x cap; several of these must fit inside JOB_TIMEOUT_S.
        - name: QE_TIMEOUT_S
          value: "600"
        # MPI ranks per QE run. Kept EQUAL to requests.cpu below, not to the
        # limit: the limit is only reachable when the node happens to be idle,
        # while the request is what the scheduler guarantees. Launching 32 ranks
        # against a 4-core guarantee is what produced runs reporting 11.6s CPU
        # against 26.8s wall — more than half the time descheduled, plus the
        # communication cost of 32 ranks for the throughput of four.
        - name: JOB_NP
          value: "8"
        # k-point pools, off. Measured on diamond Si (2 atoms, 29 irreducible
        # k-points): 8 ranks takes 0.89s with pools and 0.89s without — no
        # effect at all at this size. Pools earn their keep on larger cells with
        # many k-points, not on the workshop systems, and splitting 8 ranks into
        # pools only shrinks the plane-wave group each one gets.
        - name: QE_NK
          value: "0"
        # Tells db.py this process is a worker, so it takes a small connection
        # pool (2+2) instead of the API's 10. See the note there.
        - name: TRITONDFT_ROLE
          value: "worker"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: OMP_NUM_THREADS
          value: "1"
        resources:
          requests:
            # Equal to JOB_NP: every rank we launch is a core we are promised.
            # 8 replicas x 8 = 64 cores reserved, which is placeable on NRP;
            # 8 x 32 would be a 256-core reservation on an opportunistic
            # priority class with no allocation, and the pods would sit Pending.
            cpu: "8"
            memory: "8Gi"
          limits:
            # Headroom for a burst on an idle node, not a target. Measured on
            # diamond Si, 8 -> 32 ranks buys 0.3s (0.89s -> 0.60s) while the
            # harness around each step costs ~30s, so there is nothing here
            # worth a larger reservation.
            cpu: "16"
            memory: "48Gi"
        volumeMounts:
        - name: workdir
          mountPath: /workspace/tmp
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workdir
        persistentVolumeClaim:
          claimName: tritondft-workdir
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
